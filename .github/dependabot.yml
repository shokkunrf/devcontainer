version: 2
updates:
  # Bumps the root and each image's devcontainer-lock.json; cut an image release after merging image updates
  - package-ecosystem: "devcontainers"
    directories:
      - "/"
      - "/images/*"
    schedule:
      interval: "weekly"
    groups:
      devcontainer-features:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
