name: "CD: Weekly Prerelease DevContainer Image"

on:
  schedule:
    - cron: "0 0 * * 5" # Every Friday 00:00 UTC
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name (empty for all)"
        required: false
        type: string

concurrency:
  group: cd-images

jobs:
  create-prerelease:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image_name: ${{ steps.release.outputs.image_name }}
      sha_tag: ${{ steps.release.outputs.sha_tag }}
      image_ref: ${{ steps.release.outputs.image_ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create prerelease
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_IMAGE: ${{ inputs.image_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          REPO_OWNER=$(echo "$REPOSITORY" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPOSITORY" | cut -d'/' -f2)

          if [ -n "$INPUT_IMAGE" ]; then
            IMAGES="$INPUT_IMAGE"
          else
            IMAGES=$(ls -d images/*/ | xargs -n1 basename)
          fi

          # TODO: Support multiple images via matrix strategy when needed
          IMAGE_NAME=$(echo "$IMAGES" | head -1)

          if [ ! -d "images/${IMAGE_NAME}" ]; then
            echo "::error::Image '${IMAGE_NAME}' not found"
            exit 1
          fi

          # Find latest tag for this image
          LATEST_TAG=$(git tag -l "images/${IMAGE_NAME}/v*" | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "::warning::No existing tag for '${IMAGE_NAME}', skipping."
            exit 1
          fi

          # Use the same commit as the latest tag (no code changes)
          RELEASE_TARGET=$(git rev-list -n 1 "$LATEST_TAG")

          # Check if latest tag is an unpromoted prerelease
          IS_PRERELEASE=$(gh release view "$LATEST_TAG" --repo "$REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo "")

          if [ "$IS_PRERELEASE" = "true" ]; then
            # Overwrite: delete and recreate with same version
            echo "Deleting unpromoted prerelease: ${LATEST_TAG} (commit: ${RELEASE_TARGET})"
            gh release delete "$LATEST_TAG" --repo "$REPOSITORY" --yes --cleanup-tag
            NEXT_VERSION=$(echo "$LATEST_TAG" | sed 's|.*/v||')
          else
            # Already promoted: bump patch version
            VERSION=$(echo "$LATEST_TAG" | sed 's|.*/v||')
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          TAG="images/${IMAGE_NAME}/v${NEXT_VERSION}"

          echo "Creating prerelease: ${TAG} (commit: ${RELEASE_TARGET})"

          SHA_TAG="sha-$(echo "$RELEASE_TARGET" | head -c 7)"
          IMAGE_REF="ghcr.io/${REPO_OWNER}/${REPO_NAME}-images/${IMAGE_NAME}"

          git tag -f "$TAG" "$RELEASE_TARGET"
          git push origin "refs/tags/$TAG" -f

          gh release create "$TAG" \
            --prerelease \
            --title "$TAG" \
            --notes "Prerelease for ${IMAGE_NAME}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

  build:
    needs: create-prerelease
    uses: ./.github/workflows/_images-build.yml
    with:
      image_name: ${{ needs.create-prerelease.outputs.image_name }}
      ref: ${{ needs.create-prerelease.outputs.tag }}
      image_ref: ${{ needs.create-prerelease.outputs.image_ref }}
      sha_tag: ${{ needs.create-prerelease.outputs.sha_tag }}
    permissions:
      packages: write
      contents: read
