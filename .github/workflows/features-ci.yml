name: "CI: Test DevContainer Features"

on:
  push:
    branches:
      - develop
    paths:
      - "features/**"
  pull_request:
    paths:
      - "features/**"
  workflow_dispatch:

jobs:
  detect:
    uses: ./.github/workflows/_detect-changed.yml
    with:
      paths: "features/src features/test"

  test:
    needs: detect
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.detect.outputs.names) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test feature
        working-directory: features
        run: |
          devcontainer features test \
            -f ${{ matrix.feature }} \
            --skip-autogenerated
