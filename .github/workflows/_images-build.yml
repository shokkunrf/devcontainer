name: "Build DevContainer Image"

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name (e.g., base)"
        required: true
        type: string
      ref:
        description: "Git ref to checkout"
        required: true
        type: string
      image_ref:
        description: "Full image path (e.g., ghcr.io/owner/repo-images/base)"
        required: true
        type: string
      sha_tag:
        description: "SHA-based Docker tag (e.g., sha-abc1234)"
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build and test
        if: matrix.suffix == 'amd64'
        run: |
          devcontainer up --workspace-folder "images/${{ inputs.image_name }}"
          devcontainer exec --workspace-folder "images/${{ inputs.image_name }}" \
            /bin/sh -c 'if [ -f test-project/test.sh ]; then cd test-project && chmod +x test.sh && ./test.sh; else echo "No test-project/test.sh found, skipping."; fi'

      - name: Build and push
        run: |
          devcontainer build \
            --workspace-folder "images/${{ inputs.image_name }}" \
            --image-name "${{ inputs.image_ref }}:${{ inputs.sha_tag }}-${{ matrix.suffix }}" \
            --platform "${{ matrix.platform }}" \
            --push

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t "${{ inputs.image_ref }}:${{ inputs.sha_tag }}" \
            "${{ inputs.image_ref }}:${{ inputs.sha_tag }}-amd64" \
            "${{ inputs.image_ref }}:${{ inputs.sha_tag }}-arm64"
