name: "CD: Build and Push DevContainer Image"

on:
  push:
    tags:
      - 'images/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., images/base/v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract image name and version from tag
        id: meta
        run: |
          # images/base/v1.0.0 → name=base, version=1.0.0
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME=$(echo "$TAG" | cut -d'/' -f2)
          VERSION=$(echo "$TAG" | sed 's|.*/v||')

          # Generate version tags: v2.0.0 → 2.0.0,2.0,2
          MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION" | cut -d'.' -f2)
          TAGS="${VERSION},${MAJOR}.${MINOR},${MAJOR}"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Validate image exists
        run: |
          if [ ! -d "images/${{ steps.meta.outputs.name }}" ]; then
            echo "::error::Image '${{ steps.meta.outputs.name }}' not found"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (multi-arch)
        uses: devcontainers/ci@v0.3
        with:
          subFolder: images/${{ steps.meta.outputs.name }}
          imageName: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-images/${{ steps.meta.outputs.name }}
          imageTag: ${{ steps.meta.outputs.tags }},latest
          platform: linux/amd64,linux/arm64
          push: always
