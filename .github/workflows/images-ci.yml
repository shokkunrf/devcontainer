name: "CI: Test DevContainer Images"

on:
  push:
    branches:
      - develop
    paths:
      - "images/**"
  pull_request:
    paths:
      - "images/**"
  workflow_dispatch:

jobs:
  detect:
    uses: ./.github/workflows/_detect-changed.yml
    with:
      paths: "images"

  test:
    needs: detect
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.names) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build image
        run: devcontainer up --workspace-folder "images/${{ matrix.image }}"

      - name: Run tests
        run: |
          devcontainer exec --workspace-folder "images/${{ matrix.image }}" \
            /bin/sh -c 'if [ -f test-project/test.sh ]; then cd test-project && chmod +x test.sh && ./test.sh; else echo "No test-project/test.sh found, skipping."; fi'
